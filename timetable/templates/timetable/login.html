<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Timetable System</title>
    
    {% load static %}
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'timetable/css/style.css' %}">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-body p-5">                      
                        <div class="text-center mb-4">
                            <i class="bi bi-calendar-week display-4 text-primary"></i>
                            <h2 class="h3 mt-2 fw-normal">Timetable System</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}  
                            
                            {% if form.errors %}
                            <div class="alert alert-danger">
                                Invalid username or password.
                            </div>
                            {% endif %}

                            <div class="mb-3">
                                <label for="id_username" class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" name="username" id="id_username" 
                                           class="form-control" placeholder="Enter your username" required
                                           value="{{ form.username.value|default:'' }}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="id_password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" name="password" id="id_password" 
                                           class="form-control" placeholder="Enter your password" required>
                                </div>
                            </div>

                            <input type="hidden" name="next" value="{{ request.GET.next }}">

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                                </button>
                            </div>
                        </form>

                        <!-- Footer -->
                        <div class="text-center mt-4">
                            <small class="text-muted">
                                &copy; {% now "Y" %} Call Center System
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
